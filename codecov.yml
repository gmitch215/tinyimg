coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: c
      paths:
        - src/
    - name: node
      paths:
        - src/ts/
    - name: workers
      paths:
        - src/ts/

ignore:
  - 'tests/**/*'
  - 'bench/**/*'
  - 'scripts/**/*'
  - 'docs/**/*'
  - 'types/**/*'
  - 'coverage/**/*'
  - 'dist/**/*'
  - 'bin/**/*'
  - 'blobs/**/*'
  - 'build*/**/*'
  - '**/*.spec.ts'
  - 'vitest.config.ts'
  - 'typedoc.json'

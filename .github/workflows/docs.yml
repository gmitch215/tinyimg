name: Publish Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm binaryen
      - name: Install Doxygen
        uses: ssciwr/doxygen-install@v2
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build Doxygen
        run: bun run docs:c
      - name: Build WASM
        run: bun run build:wasm
      - name: Build TypeDoc
        run: bun run docs:build
      - name: Build The Landing Page
        run: bun run docs:site
      - name: Deploy Doxygen
        run: bash doxygen.sh "${GITHUB_SHA::7}"
      - name: Deploy TypeDoc
        run: bash typedoc.sh "${GITHUB_SHA::7}"
